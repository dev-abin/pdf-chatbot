name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e "./apps/backend[dev]"
      - run: pip install -e ./apps/frontend
      - run: ruff check apps/backend/src/app/api/chat.py apps/backend/src/app/core/settings.py apps/backend/src/app/db/base.py apps/backend/src/app/rag/retrieval.py apps/backend/src/app/schemas/chat_schema.py apps/frontend/rag_ui/layout/chat_page.py apps/backend/tests/test_traceability.py
      - run: pytest apps/backend/tests/test_traceability.py

