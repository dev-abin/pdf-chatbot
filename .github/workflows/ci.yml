name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e "./apps/api[dev]"
      - run: pip install -e ./apps/web
      - run: ruff check apps/api/src tests/unit apps/web/rag_ui
      - run: pytest tests/unit/test_traceability.py

