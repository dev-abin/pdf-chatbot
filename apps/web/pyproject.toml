[project]
name = "documind-web"
version = "0.2.0"
description = "Streamlit console for the DocuMind RAG platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "streamlit>=1.51.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "rag_ui", "rag_ui.layout"]

