services:
  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - OLLAMA_API_URL=http://host.docker.internal:11434
      - DOCUMIND_DATA_DIR=/app/data
      - DOCUMIND_LOG_DIR=/app/logs
    ports:
      - "8000:8000"
    volumes:
      # Backend-local data and logs inside the service
      - backend_data:/app/data
      - backend_logs:/app/logs
    restart: unless-stopped

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Frontend calls backend by service name
      - UPLOAD_FILE_URL=http://backend:8000/api/upload-files/
      - CHAT_API_URL=http://backend:8000/api/chat/
    ports:
      - "8501:8501"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
  backend_logs:

