[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "apps/**/data", "apps/**/logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["apps/api/src", "apps/web"]
testpaths = ["tests/unit", "tests/integration"]

