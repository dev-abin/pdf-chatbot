[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "apps/**/data", "apps/**/logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["apps/backend/src", "apps/frontend"]
testpaths = ["apps/backend/tests", "apps/frontend/tests"]

